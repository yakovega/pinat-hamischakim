<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תפוס את הכוכב – פינת המשחקים</title>
<meta name="description" content="כוכבים קופצים בשמיים ונעלמים מהר. לוחצים עליהם, נזהרים מפצצות, ומנסים להיכנס לטבלת השיאים.">
<link rel="canonical" href="https://yakovega.github.io/pinat-hamischakim/stars.html">
<meta property="og:title" content="תפוס את הכוכב – פינת המשחקים">
<meta property="og:description" content="כוכבים קופצים בשמיים ונעלמים מהר. לוחצים עליהם, נזהרים מפצצות, ומנסים להיכנס לטבלת השיאים.">
<meta property="og:url" content="https://yakovega.github.io/pinat-hamischakim/stars.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: HUD strip on top, a night-sky play field filling the rest, start/score cards float over it. Same bright toy-box look as the site hub. */
:root{
  color-scheme:dark;
  --ground:#141C30; --sky1:#0e1430; --sky2:#26205a; --card:#1F2A44; --paper:#FFF8EC; --sun:#FFC94A; --orange:#F28C28;
  --red:#ff5a3c; --teal:#1E9E8A; --muted:#C9D2E6; --line:#33416A;
  --display:'Fredoka','Arial Rounded MT Bold',Arial,sans-serif;
  --body:'Rubik',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow:hidden}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(22px,4.5vw,34px);margin:0;color:var(--sun)}
.homelink{background:var(--sun);color:#1F2A44;padding:8px 14px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px}
.hud{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:12px;padding:6px 14px;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.pill span{color:var(--muted);font-size:13px;font-weight:600}
.pill b{font-family:var(--display);font-size:24px}
.pill.time b{color:var(--sun)} .pill.time.low b{color:var(--red)}
.field{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,var(--sky2),var(--sky1) 70%);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:crosshair}
.bg{position:absolute;inset:0;width:100%;height:100%}
.target{position:absolute;border:0;background:none;padding:0;cursor:pointer;transform:translate(-50%,-50%) scale(0);animation:appear .18s ease-out forwards;line-height:1;touch-action:manipulation}
.target svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px #ffd54a99)}
.target.gold svg{filter:drop-shadow(0 0 14px #fff)}
.target.bomb svg{filter:drop-shadow(0 0 8px #ff5a3c99)}
.target.going{animation:fade .25s ease-in forwards}
@keyframes appear{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes fade{to{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.pop{position:absolute;direction:ltr;white-space:nowrap;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:28px;pointer-events:none;animation:rise .7s ease-out forwards;text-shadow:0 2px 6px #000a}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:#0b1020aa}
.card{background:var(--paper);color:#1F2A44;border-radius:22px;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;width:min(100%,460px);max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-size:clamp(28px,6vw,40px);margin:0;color:var(--orange)}
.card p{margin:0;line-height:1.5}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:26px;height:26px}
.seg{display:flex;gap:4px;background:#e9e1d1;padding:4px;border-radius:12px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font:600 15px var(--body);cursor:pointer;color:#1F2A44}
.seg button[aria-pressed="true"]{background:#1F2A44;color:var(--paper)}
.big{font-family:var(--display);font-weight:700;font-size:24px;border:0;border-radius:99px;padding:12px 40px;background:var(--orange);color:#1F2A44;cursor:pointer;box-shadow:0 5px 0 #a85c12}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a85c12}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.final{font-family:var(--display);font-weight:700;font-size:clamp(60px,15vw,96px);line-height:1;color:var(--orange);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats div{background:#efe6d4;border-radius:10px;padding:6px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--display);font-size:20px}
.namebox{display:flex;gap:8px;width:100%}
.namebox input{flex:1;min-width:0;font:600 18px var(--body);border-radius:10px;border:2px solid #d8ccb4;padding:8px 12px;background:#fff;color:#1F2A44}
.namebox button{border:0;border-radius:10px;padding:8px 14px;font:600 16px var(--body);background:var(--teal);color:#fff;cursor:pointer}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board td{padding:5px 8px;border-bottom:1px solid #e6dcc8;text-align:right}
.board td:last-child{text-align:left;font-weight:800}
.board tr.me td{background:#ffe9a8}
.board caption{font-weight:800;margin-bottom:4px;text-align:right}
.ghost{border:2px solid #d8ccb4;background:transparent;color:#1F2A44;border-radius:99px;padding:8px 18px;font:600 15px var(--body);cursor:pointer}
.count{font-family:var(--display);font-weight:700;font-size:120px;color:var(--sun);text-shadow:0 6px 20px #000a;animation:beat .8s ease-out}
@keyframes beat{from{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.target,.target.going,.pop,.count{animation:none}.target{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div class="top">
  <h1>תפוס את הכוכב</h1>
  <div class="hud">
    <div class="pill time" id="timePill"><span>זמן</span><b id="time">30</b></div>
    <div class="pill"><span>נקודות</span><b id="score">0</b></div>
    <div class="pill"><span>שיא</span><b id="best">0</b></div>
  </div>
  <a class="homelink" href="index.html">🏠 דף הבית</a>
</div>

<div class="field" id="field">
  <canvas class="bg" id="bg" aria-hidden="true"></canvas>
  <div class="overlay" id="startOv">
    <div class="card">
      <h2>תפוס את הכוכב</h2>
      <p>כוכבים קופצים בשמיים ונעלמים אחרי רגע. לחצו עליהם הכי מהר שאפשר לפני שנגמר הזמן!</p>
      <div class="legend">
        <span><svg viewBox="0 0 100 100"><use href="#star" fill="#FFC94A"/></svg>כוכב: 10</span>
        <span><svg viewBox="0 0 100 100"><use href="#star" fill="#fff6c7"/></svg>זהב: 30 + זמן</span>
        <span><svg viewBox="0 0 100 100"><use href="#bomb"/></svg>פצצה: מינוס 20</span>
      </div>
      <div class="seg" role="group" aria-label="רמה" id="levels">
        <button type="button" data-l="easy" aria-pressed="false">🐢 קל</button>
        <button type="button" data-l="mid" aria-pressed="true">🐇 בינוני</button>
        <button type="button" data-l="hard" aria-pressed="false">🚀 מהיר</button>
      </div>
      <button class="big" id="go" type="button">מתחילים!</button>
    </div>
  </div>
  <div class="overlay" id="countOv" hidden><div class="count" id="count">3</div></div>
  <div class="overlay" id="endOv" hidden>
    <div class="card">
      <span style="font-weight:600;color:#6b7280">הנקודות שלך</span>
      <div class="final" id="final">0</div>
      <p id="msg"></p>
      <div class="stats" id="stats"></div>
      <form class="namebox" id="nameForm">
        <input id="pname" maxlength="16" placeholder="הכניסו שם לטבלת השיאים" aria-label="שם לטבלת השיאים">
        <button type="submit">שמור</button>
      </form>
      <table class="board" id="board"><caption id="boardCap"></caption><tbody id="rows"></tbody></table>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="big" id="again" type="button">עוד פעם!</button>
        <button class="ghost" id="menu" type="button">לשנות רמה</button>
      </div>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="star" d="M50 4 L62 36 L96 38 L69 59 L79 93 L50 73 L21 93 L31 59 L4 38 L38 36 Z" stroke="#fff8" stroke-width="3" stroke-linejoin="round"/>
    <g id="bomb"><circle cx="46" cy="58" r="34" fill="#2a2a33" stroke="#555" stroke-width="3"/><rect x="58" y="14" width="16" height="16" rx="3" fill="#555" transform="rotate(35 66 22)"/><path d="M72 16 Q84 4 92 12" stroke="#c9a46a" stroke-width="4" fill="none"/><circle cx="93" cy="11" r="6" fill="#ff5a3c"/><circle cx="34" cy="46" r="7" fill="#fff4"/></g>
  </defs>
</svg>

<script>
(function(){
const $=id=>document.getElementById(id);
const field=$('field'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS={easy:{life:1500,every:900,max:2,bomb:.08,size:[70,96]},mid:{life:1100,every:650,max:3,bomb:.14,size:[56,84]},hard:{life:800,every:430,max:4,bomb:.2,size:[44,70]}};
const NAMES={easy:'קל',mid:'בינוני',hard:'מהיר'};
let level='mid',score=0,time=30,running=false,spawnT=null,clockT=null,targets=new Set(),hits=0,misses=0,golds=0,bombs=0,combo=0,bestCombo=0,lastScore=0,saved=false;
try{level=localStorage.getItem('stars-level')||level}catch(e){}

/* ---------- high scores ---------- */
function getBoard(){try{return JSON.parse(localStorage.getItem('stars-board-'+level)||'[]')}catch(e){return[]}}
function setBoard(b){try{localStorage.setItem('stars-board-'+level,JSON.stringify(b))}catch(e){}}
function bestScore(){const b=getBoard();return b.length?b[0].s:0}
function showBest(){$('best').textContent=bestScore()}
function renderBoard(mark){
  const b=getBoard();$('boardCap').textContent=`🏆 טבלת השיאים (רמה ${NAMES[level]})`;
  $('rows').innerHTML='';
  if(!b.length){$('rows').innerHTML='<tr><td colspan="3" style="text-align:center;color:#6b7280">עוד אין שיאים. היו הראשונים!</td></tr>';return}
  b.forEach((r,i)=>{const tr=document.createElement('tr');if(i===mark)tr.className='me';
    tr.innerHTML=`<td>${['🥇','🥈','🥉'][i]||i+1}</td><td></td><td>${r.s}</td>`;tr.children[1].textContent=r.n;$('rows').appendChild(tr)});
}

/* ---------- level buttons ---------- */
function syncLevels(){document.querySelectorAll('#levels button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===level));showBest()}
$('levels').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;level=b.dataset.l;try{localStorage.setItem('stars-level',level)}catch(e){};syncLevels()});
syncLevels();

/* ---------- game ---------- */
function countdown(){
  $('startOv').hidden=true;$('endOv').hidden=true;$('countOv').hidden=false;
  let n=3;const step=()=>{if(n===0){$('countOv').hidden=true;start();return}
    const el=$('count');el.textContent=n;el.style.animation='none';void el.offsetWidth;el.style.animation='';beep(440+n*40,.12);n--;setTimeout(step,700)};
  step();
}
function start(){
  score=0;time=30;hits=misses=golds=bombs=combo=bestCombo=0;saved=false;running=true;updateHud();
  spawn();spawnT=setInterval(()=>{if(targets.size<LEVELS[level].max)spawn()},LEVELS[level].every);
  clockT=setInterval(()=>{time--;updateHud();if(time<=5&&time>0)beep(880,.06);if(time<=0)end()},1000);
}
function updateHud(){$('time').textContent=Math.max(0,time);$('score').textContent=score;$('timePill').classList.toggle('low',time<=5)}
function spawn(){
  const L=LEVELS[level],r=Math.random();
  const kind=r<L.bomb?'bomb':r<L.bomb+.08?'gold':'star';
  const size=kind==='gold'?L.size[0]*.85:L.size[0]+Math.random()*(L.size[1]-L.size[0]);
  const rect=field.getBoundingClientRect(),pad=size/2+6;
  let x,y,tries=0;
  do{x=pad+Math.random()*(rect.width-2*pad);y=pad+Math.random()*(rect.height-2*pad);tries++}
  while(tries<12&&[...targets].some(t=>Math.hypot(t.x-x,t.y-y)<size));
  const b=document.createElement('button');b.type='button';b.className='target '+kind;
  b.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
  b.setAttribute('aria-label',kind==='bomb'?'פצצה':'כוכב');
  b.innerHTML=kind==='bomb'?'<svg viewBox="0 0 100 100"><use href="#bomb"/></svg>':`<svg viewBox="0 0 100 100"><use href="#star" fill="${kind==='gold'?'#fff6c7':'#FFC94A'}"/></svg>`;
  const t={el:b,x,y,kind};targets.add(t);
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();hit(t)});
  field.appendChild(b);
  t.timer=setTimeout(()=>{if(!targets.has(t))return;if(kind!=='bomb'){misses++;combo=0}remove(t)},kind==='gold'?L.life*.7:L.life);
}
function remove(t){targets.delete(t);clearTimeout(t.timer);t.el.classList.add('going');setTimeout(()=>t.el.remove(),260)}
function hit(t){
  if(!running||!targets.has(t))return;
  let pts,txt,col;
  if(t.kind==='bomb'){bombs++;combo=0;pts=-20;txt='−20 💥';col='#ff5a3c';boom();field.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:220})}
  else{hits++;combo++;bestCombo=Math.max(bestCombo,combo);
    const bonus=combo>=5?5:0;
    if(t.kind==='gold'){golds++;pts=30+bonus;time+=2;txt=`+${pts} ⏱+2`;col='#fff6c7';chime(true)}
    else{pts=10+bonus;txt=`+${pts}`;col='#FFC94A';chime(false)}
    if(combo>0&&combo%5===0)txt+=` 🔥${combo}`;
    sparkle(t.x,t.y,t.kind==='gold');}
  score=Math.max(0,score+pts);updateHud();popText(t.x,t.y,txt,col);remove(t);
}
field.addEventListener('pointerdown',e=>{if(running&&(e.target===field||e.target.id==='bg'))combo=0});
function popText(x,y,txt,col){const p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.cssText=`left:${x}px;top:${y}px;color:${col}`;field.appendChild(p);setTimeout(()=>p.remove(),720)}
function end(){
  running=false;clearInterval(spawnT);clearInterval(clockT);
  [...targets].forEach(remove);
  lastScore=score;
  $('final').textContent=score;
  const acc=hits+misses+bombs?Math.round(hits/(hits+misses+bombs)*100):0;
  $('stats').innerHTML=`<div><b>${hits}</b>כוכבים</div><div><b>${golds}</b>זהב</div><div><b>${bombs}</b>פצצות</div><div><b>${bestCombo}</b>רצף</div><div><b>${acc}%</b>דיוק</div>`;
  const prevBest=bestScore(),b=getBoard();
  const qualifies=score>0&&(b.length<5||score>b[b.length-1].s);
  $('msg').textContent=score>prevBest&&score>0?'🏆 שיא חדש! מדהים!':score>=prevBest*.8&&score>0?'כמעט שיא! עוד פעם?':score>0?'יפה! אפשר לשבור את השיא.':'הכוכבים מהירים! נסו את רמה קל.';
  $('nameForm').hidden=!qualifies;
  try{$('pname').value=localStorage.getItem('stars-name')||''}catch(e){}
  renderBoard(-1);$('endOv').hidden=false;
  if(score>prevBest&&score>0)fanfare();
  setTimeout(()=>{(qualifies?$('pname'):$('again')).focus({preventScroll:true})},50);
}
$('nameForm').addEventListener('submit',e=>{e.preventDefault();if(saved)return;
  const n=$('pname').value.trim()||'שחקן';try{localStorage.setItem('stars-name',n)}catch(e){}
  const b=getBoard();b.push({n,s:lastScore});b.sort((a,c)=>c.s-a.s);const top=b.slice(0,5);setBoard(top);
  saved=true;$('nameForm').hidden=true;renderBoard(top.findIndex(r=>r.n===n&&r.s===lastScore));showBest()});
$('go').onclick=countdown;$('again').onclick=countdown;
$('menu').onclick=()=>{$('endOv').hidden=true;$('startOv').hidden=false;syncLevels()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)end()});

/* ---------- twinkling background + sparkles ---------- */
const bg=$('bg'),g=bg.getContext('2d');let dots=[],sparks=[];
function size(){const r=field.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);bg.width=r.width*d;bg.height=r.height*d;g.setTransform(d,0,0,d,0,0);
  dots=Array.from({length:Math.round(r.width*r.height/5000)},()=>({x:Math.random()*r.width,y:Math.random()*r.height,r:Math.random()*1.4+.3,p:Math.random()*6}))}
new ResizeObserver(size).observe(field);size();
function sparkle(x,y,gold){if(still)return;for(let i=0;i<(gold?22:12);i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:gold?'#fff':'#FFC94A'})}}
function frame(t){
  const r=field.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);
  dots.forEach(d=>{g.globalAlpha=still?.7:.35+.35*Math.sin(t/700+d.p);g.fillStyle='#fff';g.beginPath();g.arc(d.x,d.y,d.r,0,7);g.fill()});
  sparks=sparks.filter(s=>(s.l-=.03)>0);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.12;g.globalAlpha=s.l;g.fillStyle=s.c;g.fillRect(s.x-2,s.y-2,4,4)});
  g.globalAlpha=1;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- sound ---------- */
let ac=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}return ac}
function tone(f,t,d,type='triangle',v=.12){const a=audio();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),s=a.currentTime+t;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(.0001,s);gn.gain.exponentialRampToValueAtTime(v,s+.01);gn.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(gn).connect(a.destination);o.start(s);o.stop(s+d+.05)}
const beep=(f,d)=>tone(f,0,d,'sine',.08);
function chime(gold){const base=700+Math.min(combo,10)*30;tone(base,0,.12);tone(base*1.5,.06,.18);if(gold)tone(base*2,.12,.25)}
function boom(){tone(90,0,.35,'sawtooth',.12);tone(60,.05,.4,'square',.06)}
function fanfare(){[523,659,784,1046].forEach((f,k)=>tone(f,k*.12,.35))}
})();
</script>
</body>
</html>

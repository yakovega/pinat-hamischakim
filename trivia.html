 {q:"באיזו שנה שיחקה נבחרת ישראל במונדיאל?",e:"🇮🇱",a:[["1970","📻"],["1990","📼"],["2006","📱"],["1958","📺"]],c:0},
 {q:"איזו נבחרת אירחה וגם זכתה במונדיאל 1966?",e:"🏆",a:[["אנגליה","🇬🇧"],["גרמניה","🇩🇪"],["צרפת","🇫🇷"],["מקסיקו","🇲🇽"]],c:0},
 {q:"כמה נבחרות שיחקו במונדיאל 2026?",e:"🌎",a:[["48","🔢"],["32","🎲"],["24","🕐"],["64","♟️"]],c:0},
 {q:"מי זכה בכדור הזהב הכי הרבה פעמים?",e:"🌟",a:[["ליונל מסי","🇦🇷"],["כריסטיאנו רונאלדו","🇵🇹"],["פלה","🇧🇷"],["זינדין זידאן","🇫🇷"]],c:0},
 {q:"איזו קבוצה זכתה הכי הרבה פעמים בליגת האלופות?",e:"⭐",a:[["ריאל מדריד","⚪"],["ברצלונה","🔵"],["מנצ׳סטר יונייטד","🔴"],["יובנטוס","⚫"]],c:0},
 {q:"מה הרוחב של שער כדורגל רשמי?",e:"🥅",a:[["7.32 מטר","📏"],["5 מטר","📐"],["10 מטר","🔟"],["3 מטר","3️⃣"]],c:0},
 {q:"מי זכתה במונדיאל 2018?",e:"🏆",a:[["צרפת","🇫🇷"],["קרואטיה","🇭🇷"],["גרמניה","🇩🇪"],["ספרד","🇪🇸"]],c:0},
 {q:"באיזו עיר נמצא אצטדיון סנטיאגו ברנבאו?",e:"🏟️",a:[["מדריד","🇪🇸"],["ברצלונה","🇪🇸"],["ליסבון","🇵🇹"],["בואנוס איירס","🇦🇷"]],c:0},
 {q:"כמה חילופים מותר לקבוצה לעשות במשחק רגיל בלי הארכה?",e:"🔄",a:[["5","🖐️"],["3","🤟"],["7","7️⃣"],["כמה שרוצים","♾️"]],c:0},
 {q:"מי הבקיע הכי הרבה גולים במונדיאלים עד 2022?",e:"🥇",a:[["מירוסלב קלוזה","🇩🇪"],["פלה","🇧🇷"],["ליונל מסי","🇦🇷"],["רונאלדו הברזילאי","🇧🇷"]],c:0}
];
const LEVELS={easy:{name:"קל",bank:BANK},normal:{name:"רגיל",bank:NORMAL},medium:{name:"בינוני",bank:MEDIUM},hard:{name:"קשה",bank:HARD},ultra:{name:"אולטרה קשה",bank:ULTRA}};
const ORDER=["easy","normal","medium","hard","ultra"];
const ULTRA_TIME=15;
let tick=null;
const $=id=>document.getElementById(id);
const screen=$("screen");
let order=[],i=0,goals=0,locked=false,voice=true,level="easy";

function say(t){
  if(!voice)return;
  try{
    const s=window.speechSynthesis; if(!s)return;
    s.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="he-IL"; u.rate=.9;
    const v=s.getVoices().find(v=>/^he|^iw/i.test(v.lang)); if(v)u.voice=v;
    s.speak(u);
  }catch(e){}
}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function board(){
  const L=order.length||12;
  $("sQ").textContent=Math.min(i+1,L)+"/"+L;
  $("sG").textContent=goals;
  $("goals").textContent="⚽".repeat(goals);
}

function home(){
  clearInterval(tick);order=[];i=0;goals=0;board();$("sQ").textContent="0/12";
  screen.innerHTML=`<div class="stack">
    <div class="big-emoji">⚽🥅</div>
    <h1>אצטדיון הטריוויה</h1>
    <p>12 שאלות כדורגל. כל תשובה נכונה היא גול!<br>בחרו רמה:</p>
    <div class="levels">
      <button class="lvl" data-l="easy"><span class="pic">🙂</span>קל<small>3 תשובות, לגילאי 5–7</small></button>
      <button class="lvl normal" data-l="normal"><span class="pic">😃</span>רגיל<small>3 תשובות, קצת יותר מאתגר</small></button>
      <button class="lvl medium" data-l="medium"><span class="pic">🤔</span>בינוני<small>4 תשובות, חוקי המשחק</small></button>
      <button class="lvl hard" data-l="hard"><span class="pic">💪</span>קשה<small>4 תשובות, לשחקנים מנוסים</small></button>
      <button class="lvl ultra" data-l="ultra"><span class="pic">🔥</span>אולטרה קשה<small>שאלות של מומחים, ורק 15 שניות לכל שאלה!</small></button>
    </div>
  </div>`;
  screen.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{level=b.dataset.l;start()});
  screen.querySelector(".lvl").focus();
}

function start(){
  order=shuffle(LEVELS[level].bank).map(q=>{const idx=shuffle(q.a.map((_,n)=>n));return{q:q.q,e:q.e,a:idx.map(n=>q.a[n]),c:idx.indexOf(q.c)}});
  i=0;goals=0;ask();
}

function ask(){
  const q=order[i]; locked=false; board(); clearInterval(tick);
  screen.innerHTML=`<div class="stack pop">
    ${level==="ultra"?`<div class="timer"><i id="bar"></i></div>`:""}
    <div class="big-emoji">${q.e}</div>
    <h2>${q.q}</h2>
    <div class="row"><button class="btn ghost" id="spk">🔊 הקראה</button></div>
    <div class="answers${q.a.length===4?" four":""}">${q.a.map((t,n)=>`<button class="ans" data-n="${n}"><span class="pic">${t[1]}</span><span>${t[0]}</span></button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
  </div>`;
  screen.querySelectorAll(".ans").forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  const read=()=>say(q.q+" "+q.a.map(t=>t[0]).join(", או "));
  $("spk").onclick=read; read();
  if(level==="ultra"){
    const t0=performance.now(), bar=$("bar");
    tick=setInterval(()=>{
      const left=ULTRA_TIME-(performance.now()-t0)/1000;
      bar.style.transform=`scaleX(${Math.max(0,left/ULTRA_TIME)})`;
      bar.classList.toggle("low",left<5);
      if(left<=0)pick(-1);
    },100);
  }
}

function pick(n){
  if(locked)return; locked=true; clearInterval(tick);
  const q=order[i], ok=n===q.c;
  if(ok)goals++;
  screen.querySelectorAll(".ans").forEach(b=>{
    const k=+b.dataset.n; b.disabled=true;
    if(k===q.c)b.classList.add("right"); else if(k===n)b.classList.add("miss"); else b.classList.add("dim");
  });
  const last=i>=order.length-1;
  $("fb").innerHTML=ok
    ? `<div class="goalfx"><div class="net"></div><div class="ball">⚽</div></div><div class="verdict">גוֹל!</div>`
    : `<div class="verdict soft">${n<0?"נגמר הזמן!":"כמעט!"}</div><p>התשובה הנכונה: ${q.a[q.c][0]} ${q.a[q.c][1]}</p>`;
  $("fb").insertAdjacentHTML("beforeend",`<button class="btn" id="next">${last?"לסוף המשחק":"עוד שאלה ➜"}</button>`);
  say(ok?"גול! כל הכבוד":"כמעט! התשובה הנכונה היא "+q.a[q.c][0]);
  $("next").onclick=next; $("next").focus(); board();
}

function next(){ i++; if(i<order.length) ask(); else end(); }

function end(){
  clearInterval(tick); i=order.length-1; board();
  const nextLvl=ORDER[ORDER.indexOf(level)+1];
  const n=goals, all=order.length;
  const medal=n===all?"🏆":n>=9?"🥇":n>=6?"🥈":"🥉";
  const msg=n===all?"אלוף! כל התשובות נכונות":n>=9?"שחקן מעולה!":n>=6?"משחק טוב מאוד!":"כל הכבוד על המשחק!";
  screen.innerHTML=`<div class="stack pop">
    <div class="big-emoji">${medal}</div>
    <h1>${msg}</h1>
    <p>הבקעת <b>${n}</b> גולים מתוך ${all}</p>
    <p style="font-size:28px;word-break:break-all">${"⚽".repeat(n)}</p>
    <div class="row"><button class="btn" id="again">משחקים שוב!</button>${nextLvl?`<button class="btn" id="harder">לרמת ${LEVELS[nextLvl].name} 💪</button>`:""}<button class="btn ghost" id="menu">בחירת רמה</button></div>
  </div>`;
  if($("harder"))$("harder").onclick=()=>{level=nextLvl;start()};
  $("menu").onclick=home;
  say(msg+" הבקעת "+n+" גולים");
  $("again").onclick=start; $("again").focus();
}

document.addEventListener("keydown",e=>{
  const n=+e.key-1;
  if(!locked && /^[1-4]$/.test(e.key) && order[i] && n<order[i].a.length && screen.querySelector(".ans")) pick(n);
});
home();
</script>

</body></html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>נקודות וקווים – פינת המשחקים</title>
<meta name="description" content="מציירים קווים בין נקודות, ומי שסוגר ריבוע מקבל אותו ועוד תור. ארבעה גדלים של לוח ו־5 רמות מחשב.">

<meta property="og:description" content="מציירים קווים בין נקודות, ומי שסוגר ריבוע מקבל אותו ועוד תור. ארבעה גדלים של לוח ו־5 רמות מחשב.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: score strip on top, a square paper board centered and sized to the screen, setup controls under it. Same bright toy-box look as the site hub. */
:root{
  color-scheme:dark;
  --ground:#141C30; --card:#1F2A44; --paper:#FFF8EC; --sun:#FFC94A; --orange:#F28C28;
  --red:#ff5a3c; --blue:#3ec7ff; --muted:#C9D2E6; --line:#33416A;
  --display:'Fredoka','Arial Rounded MT Bold',Arial,sans-serif;
  --body:'Rubik',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
[hidden]{display:none!important}
.top{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(24px,5vw,36px);margin:0;color:var(--sun)}
.homelink{background:var(--sun);color:#1F2A44;padding:8px 14px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px}
.bar{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:7px 12px;border:3px solid transparent;transition:border-color .2s,transform .2s;min-width:0}
.pl.turn{border-color:var(--sun);transform:scale(1.04)}
.pl .dot{width:18px;height:18px;border-radius:50%;flex:none}
.pl .name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.p0 .sc{color:var(--blue)}.p1 .sc{color:var(--red)}
.msg{font-weight:800;font-size:15px;text-align:center;flex:1;min-height:20px}
.boardWrap{position:relative;width:min(100%,600px,calc(100vh - 270px));aspect-ratio:1;max-width:100%;background:var(--paper);border-radius:18px;box-shadow:0 10px 30px #0008;
  background-image:linear-gradient(#e8dcc2 1px,transparent 1px),linear-gradient(90deg,#e8dcc2 1px,transparent 1px);background-size:20px 20px}
svg{width:100%;height:100%;display:block}
.ln{stroke:#d8ccb4;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 10}
.ln.on0{stroke:#2b9fd6;stroke-dasharray:none;stroke-width:8}
.ln.on1{stroke:#e8492c;stroke-dasharray:none;stroke-width:8}
.ln.new{animation:draw .3s ease-out}
@keyframes draw{from{stroke-width:14;opacity:.5}}
.hit{stroke:transparent;stroke-width:34;stroke-linecap:round;cursor:pointer}
.hit:hover+.ln.free,.hit:focus-visible+.ln.free{stroke-dasharray:none;stroke-width:7;opacity:.6}
.turn0 .hit:hover+.ln.free,.turn0 .hit:focus-visible+.ln.free{stroke:#3ec7ff}
.turn1 .hit:hover+.ln.free,.turn1 .hit:focus-visible+.ln.free{stroke:#ff5a3c}
.hit:focus{outline:none}
.dt{fill:#1F2A44}
.box{opacity:0;transition:opacity .25s}
.box.o0{fill:#3ec7ff;opacity:.35}.box.o1{fill:#ff5a3c;opacity:.35}
.boxTxt{font-family:var(--display);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.controls{width:100%;max-width:640px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;color:var(--paper);border-radius:9px;padding:7px 10px;font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:#1F2A44}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 14px var(--body);cursor:pointer;background:var(--card);color:var(--paper)}
.btn:hover{background:#2b3a5e}.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.help{width:100%;max-width:640px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center;margin:0}
.over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.over .box2{pointer-events:auto;background:#1F2A44;color:var(--paper);border-radius:20px;padding:20px 28px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 12px 40px #000a;animation:pop .4s cubic-bezier(.2,1.6,.4,1);max-width:90%}
.over b{font-family:var(--display);font-size:clamp(28px,6vw,42px);line-height:1.1;color:var(--sun)}
.over .btn{background:var(--orange);color:#1F2A44}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ln.new,.over .box2{animation:none}.box{transition:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:6;width:100%;height:100%}
</style>
</head>
<body>
<div class="top">
  <h1>נקודות וקווים</h1>
  <a class="homelink" href="index.html">🏠 דף הבית</a>
</div>
<div class="bar">
  <div class="pl p0" id="pl0"><span class="dot" style="background:var(--blue)"></span><span class="name" id="n0">כחול</span><span class="sc" id="s0">0</span></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="pl p1" id="pl1"><span class="sc" id="s1">0</span><span class="name" id="n1">אדום</span><span class="dot" style="background:var(--red)"></span></div>
</div>
<div class="boardWrap">
  <svg id="svg" aria-label="לוח נקודות וקווים"></svg>
  <div class="over" id="over" hidden><div class="box2" role="dialog"><b id="overT"></b><span id="overP"></span><button class="btn" id="again" type="button">משחק חדש</button></div></div>
</div>
<div class="controls">
  <div class="seg" id="sizeSeg" role="group" aria-label="גודל לוח">
    <button type="button" data-v="3">3×3</button><button type="button" data-v="4">4×4</button><button type="button" data-v="5">5×5</button><button type="button" data-v="6">6×6</button>
  </div>
  <button class="btn" id="undo" type="button">↩ בטל</button>
  <button class="btn" id="newg" type="button">משחק חדש</button>
</div>
<div class="controls">
  <div class="seg" id="modeSeg" role="group" aria-label="נגד מי">
    <button type="button" data-v="2p">👫 שני שחקנים</button>
    <button type="button" data-v="veryeasy">🐣 ממש קל</button>
    <button type="button" data-v="easy">🐥 קל</button>
    <button type="button" data-v="mid">🐇 בינוני</button>
    <button type="button" data-v="hard">🦊 קשה</button>
    <button type="button" data-v="champ">🏆 אלופים</button>
  </div>
</div>
<p class="help">לוחצים בין שתי נקודות כדי לצייר קו. מי שסוגר ריבוע (הקו הרביעי מסביבו) מקבל אותו <b>וממשיך לשחק עוד תור</b>. בסוף, מי שיש לו הכי הרבה ריבועים מנצח. טיפ: זהירות לא לצייר את הקו השלישי של ריבוע, כי אז היריב יסגור אותו!</p>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
const $=id=>document.getElementById(id);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let N=4,mode='2p';
try{N=+localStorage.getItem('dots-size')||N;mode=localStorage.getItem('dots-mode')||mode}catch(e){}
// lines: h[r][c] (r=0..N, c=0..N-1), v[r][c] (r=0..N-1, c=0..N); value -1 = empty, else player who drew it
let h,v,owner,score,turn,starter=0,hist=[],over=false,busy=false,lastLine=null;
const isAI=p=>mode!=='2p'&&p===1;

function newGame(){
  h=Array.from({length:N+1},()=>Array(N).fill(-1));v=Array.from({length:N},()=>Array(N+1).fill(-1));
  owner=Array.from({length:N},()=>Array(N).fill(-1));score=[0,0];turn=starter;starter=1-starter;hist=[];over=false;busy=false;lastLine=null;
  $('over').hidden=true;build();render();
  if(isAI(turn))later(aiMove,600);
}
let timers=[];function later(f,ms){timers.push(setTimeout(f,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

/* ---------- rules ---------- */
const sides=(H,Vv,r,c)=>(H[r][c]>=0)+(H[r+1][c]>=0)+(Vv[r][c]>=0)+(Vv[r][c+1]>=0);
function boxesOf(t,r,c){ // boxes touching a line
  if(t==='h')return[[r-1,c],[r,c]].filter(([a])=>a>=0&&a<N);
  return[[r,c-1],[r,c]].filter(([,b])=>b>=0&&b<N);
}
function allFree(H,Vv){const out=[];for(let r=0;r<=N;r++)for(let c=0;c<N;c++)if(H[r][c]<0)out.push(['h',r,c]);for(let r=0;r<N;r++)for(let c=0;c<=N;c++)if(Vv[r][c]<0)out.push(['v',r,c]);return out}
function play(t,r,c){
  if(over)return;const arr=t==='h'?h:v;if(arr[r][c]>=0)return;
  hist.push({h:h.map(x=>x.slice()),v:v.map(x=>x.slice()),owner:owner.map(x=>x.slice()),score:score.slice(),turn,lastLine});
  arr[r][c]=turn;lastLine=[t,r,c];
  let got=0;for(const[a,b]of boxesOf(t,r,c))if(sides(h,v,a,b)===4&&owner[a][b]<0){owner[a][b]=turn;score[turn]++;got++}
  if(got){sfx('box',got)}else{turn=1-turn;sfx('line')}
  if(score[0]+score[1]===N*N){over=true;render();finish();return}
  render();
  if(isAI(turn)){busy=true;render();later(aiMove,got?380:520)}
}

/* ---------- computer ---------- */
const LV={veryeasy:{take:.35,safe:0,minGive:false,dd:false},easy:{take:1,safe:0,minGive:false,dd:false},mid:{take:1,safe:.85,minGive:false,dd:false},hard:{take:1,safe:1,minGive:true,dd:false},champ:{take:1,safe:1,minGive:true,dd:true}};
const clone2=a=>a.map(x=>x.slice());
function completes(H,Vv,[t,r,c]){return boxesOf(t,r,c).filter(([a,b])=>sides(H,Vv,a,b)===3).length}
function makes3(H,Vv,[t,r,c]){return boxesOf(t,r,c).some(([a,b])=>sides(H,Vv,a,b)===2)}
function setL(H,Vv,[t,r,c],p){(t==='h'?H:Vv)[r][c]=p}
// how many boxes the other player can grab in a row after this move
function giveaway(m){
  const H=clone2(h),Vv=clone2(v);setL(H,Vv,m,9);let n=0,guard=0;
  while(guard++<200){const f=allFree(H,Vv).find(x=>completes(H,Vv,x)>0);if(!f)break;n+=completes(H,Vv,f);setL(H,Vv,f,9)}
  return n;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function aiMove(){
  timers=[];if(over)return;
  const L=LV[mode]||LV.mid,free=allFree(h,v);
  const caps=free.filter(m=>completes(h,v,m)>0),safe=free.filter(m=>!makes3(h,v,m)&&completes(h,v,m)===0);
  let m=null;
  // champion trick: when only a 2-box chain is left to take and every other move would open a chain,
  // hand the 2 boxes over so the other player has to open the next long chain
  if(L.dd&&caps.length&&!safe.length){const dd=doubleDeal(caps);if(dd)m=dd}
  if(!m&&caps.length&&Math.random()<L.take)m=pick(caps);
  if(!m&&safe.length&&Math.random()<L.safe)m=pick(safe);
  if(!m&&L.minGive){let best=Infinity,bests=[];for(const f of free){if(completes(h,v,f))continue;const gv=giveaway(f);if(gv<best){best=gv;bests=[f]}else if(gv===best)bests.push(f)}if(bests.length)m=pick(bests)}
  if(!m)m=pick(free);
  busy=false;play(...m);
}
function doubleDeal(caps){
  // only when exactly one box is takeable and taking it leaves another box with 3 sides (a chain of 2 left)
  if(caps.length!==1)return null;const m=caps[0];
  const[t,r,c]=m;const A=boxesOf(t,r,c).find(([a,b])=>sides(h,v,a,b)===3);if(!A)return null;
  const B=boxesOf(t,r,c).find(([a,b])=>!(a===A[0]&&b===A[1]));if(!B||sides(h,v,B[0],B[1])!==2)return null;
  // after these two boxes, are there enough boxes left to be worth it?
  const remaining=N*N-score[0]-score[1]-2;if(remaining<3)return null;
  // the other free side of B (not the shared one)
  const[br,bc]=B;const bl=[['h',br,bc],['h',br+1,bc],['v',br,bc],['v',br,bc+1]].filter(x=>(x[0]==='h'?h:v)[x[1]][x[2]]<0&&!(x[0]===t&&x[1]===r&&x[2]===c));
  return bl.length===1?bl[0]:null;
}

/* ---------- drawing (SVG) ---------- */
const svg=$('svg'),NS='http://www.w3.org/2000/svg';let G={};
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function build(){
  svg.innerHTML='';const S=100,M=10;svg.setAttribute('viewBox',`0 0 ${N*S+2*M} ${N*S+2*M}`);G={S,M,boxes:[],texts:[],lines:{}};
  const P=(r,c)=>[M+c*S,M+r*S];
  for(let r=0;r<N;r++){G.boxes[r]=[];G.texts[r]=[];for(let c=0;c<N;c++){const[x,y]=P(r,c);G.boxes[r][c]=el('rect',{x:x+6,y:y+6,width:S-12,height:S-12,rx:10,class:'box'});
    G.texts[r][c]=el('text',{x:x+S/2,y:y+S/2,class:'boxTxt','font-size':S*.42})}}
  const mk=(t,r,c,x1,y1,x2,y2)=>{const hit=el('line',{x1,y1,x2,y2,class:'hit',tabindex:0,role:'button','aria-label':`קו ${t==='h'?'אופקי':'אנכי'}`});
    const ln=el('line',{x1,y1,x2,y2,class:'ln free'});
    hit.addEventListener('click',()=>human(t,r,c));hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();human(t,r,c)}});
    G.lines[t+r+','+c]={hit,ln}};
  for(let r=0;r<=N;r++)for(let c=0;c<N;c++){const[x,y]=P(r,c);mk('h',r,c,x+12,y,x+S-12,y)}
  for(let r=0;r<N;r++)for(let c=0;c<=N;c++){const[x,y]=P(r,c);mk('v',r,c,x,y+12,x,y+S-12)}
  for(let r=0;r<=N;r++)for(let c=0;c<=N;c++){const[x,y]=P(r,c);el('circle',{cx:x,cy:y,r:7,class:'dt'})}
}
function render(){
  svg.setAttribute('class','turn'+turn);
  for(const k in G.lines){const t=k[0],[r,c]=k.slice(1).split(',').map(Number),val=(t==='h'?h:v)[r][c],{hit,ln}=G.lines[k];
    const isNew=lastLine&&lastLine[0]===t&&lastLine[1]===r&&lastLine[2]===c;
    ln.setAttribute('class','ln '+(val<0?'free':'on'+val)+(isNew?' new':''));hit.style.display=val<0&&!over&&!busy&&!isAI(turn)?'':'none'}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const o=owner[r][c];G.boxes[r][c].setAttribute('class','box'+(o>=0?' o'+o:''));
    G.texts[r][c].textContent=o<0?'':(mode!=='2p'&&o===1?'🤖':o===0?(mode==='2p'?'כ':'⭐'):'א');G.texts[r][c].setAttribute('fill',o===0?'#1a6f95':'#a3311d')}
  $('s0').textContent=score[0];$('s1').textContent=score[1];
  $('pl0').classList.toggle('turn',!over&&turn===0);$('pl1').classList.toggle('turn',!over&&turn===1);
  $('n0').textContent=mode==='2p'?'כחול':'אתה';$('n1').textContent=mode==='2p'?'אדום':'מחשב';
  $('msg').textContent=over?'':isAI(turn)?'המחשב חושב...':(hist.length&&hist[hist.length-1].turn===turn&&score[turn]>hist[hist.length-1].score[turn]?'סגרת ריבוע! עוד תור 🎉':(turn===0?(mode==='2p'?'תור הכחול':'התור שלך'):'תור האדום'));
  $('undo').disabled=!hist.length||busy;
  document.querySelectorAll('#sizeSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===N));
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===mode));
}
function human(t,r,c){if(over||busy||isAI(turn))return;play(t,r,c)}
function finish(){
  const[a,b]=score;let t,p;
  if(a===b){t='תיקו! 🤝';p=`לשניכם ${a} ריבועים`}
  else{const w=a>b?0:1;t=mode==='2p'?`${w===0?'🔵 הכחול':'🔴 האדום'} ניצח! 🎉`:(w===0?'ניצחת! 🎉':'המחשב ניצח');p=`${Math.max(a,b)} ריבועים מול ${Math.min(a,b)}`}
  $('overT').textContent=t;$('overP').textContent=p;setTimeout(()=>{$('over').hidden=false;$('again').focus({preventScroll:true})},500);
  if(!(mode!=='2p'&&b>a)){confetti();[523,659,784,1046].forEach((f,k)=>tone(f,k*.12,.35))}
}

/* ---------- controls ---------- */
$('sizeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;N=+b.dataset.v;try{localStorage.setItem('dots-size',N)}catch(e){};clearTimers();starter=0;newGame()});
$('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.v;try{localStorage.setItem('dots-mode',mode)}catch(e){};clearTimers();starter=0;newGame()});
$('newg').onclick=()=>{clearTimers();newGame()};$('again').onclick=()=>{clearTimers();newGame()};
$('undo').onclick=()=>{if(!hist.length||busy)return;clearTimers();
  let s=hist.pop();
  if(mode!=='2p')while(s.turn===1&&hist.length)s=hist.pop(); // vs computer: back to your own move
  h=s.h;v=s.v;owner=s.owner;score=s.score;turn=s.turn;lastLine=s.lastLine;over=false;busy=false;$('over').hidden=true;render();
  if(isAI(turn)){busy=true;render();later(aiMove,500)}};

/* ---------- sound & confetti ---------- */
let ac=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}return ac}
function tone(f,t,d,type='triangle',v=.1){const a=audio();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),s=a.currentTime+t;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(.0001,s);gn.gain.exponentialRampToValueAtTime(v,s+.01);gn.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(gn).connect(a.destination);o.start(s);o.stop(s+d+.05)}
function sfx(k,n){if(k==='line')tone(520,0,.06,'sine',.06);if(k==='box'){tone(660,0,.1);tone(880,.08,.14);if(n>1)tone(1100,.16,.18)}}
const cc=$('confetti'),cx=cc.getContext('2d'),COLS=['#F28C28','#2B7DE9','#FFC94A','#1E9E8A','#ff5a3c','#3ec7ff'];
function confetti(){if(still)return;cc.width=innerWidth;cc.height=innerHeight;
  const ps=Array.from({length:170},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:Math.random()*6+4,c:COLS[Math.floor(Math.random()*6)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function t(){cx.clearRect(0,0,cc.width,cc.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
    if(++f<140)requestAnimationFrame(t);else cx.clearRect(0,0,cc.width,cc.height)})()}

newGame();
})();
</script>
</body>
</html>

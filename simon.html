<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סימון אומר – פינת המשחקים</title>
<meta name="description" content="צבעים נדלקים לפי הסדר, וצריך ללחוץ עליהם באותו סדר. בכל שלב מתווסף עוד צבע. כמה תצליחו לזכור?">
<link rel="canonical" href="https://yakovega.github.io/pinat-hamischakim/simon.html">
<meta property="og:title" content="סימון אומר – פינת המשחקים">
<meta property="og:description" content="צבעים נדלקים לפי הסדר, וצריך ללחוץ עליהם באותו סדר. בכל שלב מתווסף עוד צבע. כמה תצליחו לזכור?">
<meta property="og:url" content="https://yakovega.github.io/pinat-hamischakim/simon.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: score strip on top, the round four-color toy centered and sized to the screen, mode buttons under it. Same bright toy-box look as the site hub. */
:root{
  color-scheme:dark;
  --ground:#141C30; --card:#1F2A44; --paper:#FFF8EC; --sun:#FFC94A; --orange:#F28C28; --muted:#C9D2E6; --line:#33416A;
  --c0:#1fbf6b; --c1:#ff4a3d; --c2:#ffcc33; --c3:#2b8cff;
  --display:'Fredoka','Arial Rounded MT Bold',Arial,sans-serif;
  --body:'Rubik',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow-x:hidden}
[hidden]{display:none!important}
.top{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);margin:0;color:var(--sun)}
.homelink{background:var(--sun);color:#1F2A44;padding:8px 14px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px}
.pills{display:flex;gap:8px}
.pill{background:var(--card);border-radius:12px;padding:6px 14px;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.pill span{color:var(--muted);font-size:13px;font-weight:600}
.pill b{font-family:var(--display);font-size:24px}
.msg{font-weight:800;font-size:clamp(17px,4vw,22px);min-height:28px;text-align:center}
.toy{position:relative;width:min(92vw,calc(100vh - 290px),520px);aspect-ratio:1;max-width:100%;border-radius:50%;background:#0b1020;padding:4%;
  box-shadow:0 14px 0 #070b16,0 30px 60px #0009;display:grid;grid-template-columns:1fr 1fr;gap:4%;direction:ltr}
.pad{border:0;cursor:pointer;opacity:.55;transition:opacity .08s,filter .08s,transform .08s;touch-action:manipulation;position:relative}
.pad:nth-child(1){background:var(--c0);border-radius:100% 8% 8% 8%}
.pad:nth-child(2){background:var(--c1);border-radius:8% 100% 8% 8%}
.pad:nth-child(3){background:var(--c2);border-radius:8% 8% 8% 100%}
.pad:nth-child(4){background:var(--c3);border-radius:8% 8% 100% 8%}
.pad.lit{opacity:1;filter:brightness(1.25) saturate(1.2);box-shadow:0 0 40px 6px currentColor}
.pad:nth-child(1).lit{color:var(--c0)}.pad:nth-child(2).lit{color:var(--c1)}.pad:nth-child(3).lit{color:var(--c2)}.pad:nth-child(4).lit{color:var(--c3)}
.pad:active{transform:scale(.97)}
.pad:focus-visible{outline:4px solid var(--paper);outline-offset:-8px}
.pad kbd{position:absolute;font:700 14px var(--body);color:#0008;background:#fff6;border-radius:6px;padding:1px 7px}
.pad:nth-child(1) kbd{left:30%;top:30%}.pad:nth-child(2) kbd{right:30%;top:30%}.pad:nth-child(3) kbd{left:30%;bottom:30%}.pad:nth-child(4) kbd{right:30%;bottom:30%}
@media (hover:none){.pad kbd{display:none}}
.hub{position:absolute;left:50%;top:50%;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#1F2A44;
  box-shadow:0 0 0 10px #0b1020;display:grid;place-items:center;text-align:center}
.hub b{font-family:var(--display);font-size:clamp(34px,9vw,64px);line-height:1;font-variant-numeric:tabular-nums;color:var(--sun)}
.hub small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.start{font-family:var(--display);font-weight:700;font-size:clamp(18px,4vw,24px);border:0;border-radius:99px;padding:10px 22px;background:var(--orange);color:#1F2A44;cursor:pointer;box-shadow:0 4px 0 #a85c12}
.toy.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;color:var(--paper);border-radius:9px;padding:8px 12px;font:600 15px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:#1F2A44}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.help{color:var(--muted);font-size:13px;text-align:center;margin:0;max-width:520px;line-height:1.5}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:6;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.toy.wrong{animation:none}}
</style>
</head>
<body>
<div class="top">
  <h1>סימון אומר</h1>
  <div class="pills">
    <div class="pill"><span>שלב</span><b id="lvl">0</b></div>
    <div class="pill"><span>שיא</span><b id="best">0</b></div>
  </div>
  <a class="homelink" href="index.html">🏠 דף הבית</a>
</div>
<div class="msg" id="msg" aria-live="polite">לחצו "התחל" ותסתכלו טוב על הצבעים</div>

<div class="toy" id="toy">
  <button class="pad" type="button" aria-label="ירוק"><kbd>1</kbd></button>
  <button class="pad" type="button" aria-label="אדום"><kbd>2</kbd></button>
  <button class="pad" type="button" aria-label="צהוב"><kbd>3</kbd></button>
  <button class="pad" type="button" aria-label="כחול"><kbd>4</kbd></button>
  <div class="hub" id="hub"><button class="start" id="start" type="button">התחל</button></div>
</div>

<div class="controls">
  <div class="seg" id="speed" role="group" aria-label="מהירות">
    <button type="button" data-v="slow" aria-pressed="false">🐢 לאט</button>
    <button type="button" data-v="mid" aria-pressed="true">🐇 רגיל</button>
    <button type="button" data-v="fast" aria-pressed="false">🚀 מהר</button>
  </div>
  <div class="seg" id="kind" role="group" aria-label="סוג משחק">
    <button type="button" data-v="classic" aria-pressed="true">קלאסי</button>
    <button type="button" data-v="reverse" aria-pressed="false">🔄 הפוך</button>
  </div>
</div>
<p class="help" id="help">המשחק מדליק צבעים לפי הסדר, וצריך ללחוץ עליהם באותו סדר. בכל שלב מתווסף עוד צבע אחד. במחשב אפשר גם עם המקשים 1 עד 4.</p>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
const $=id=>document.getElementById(id);
const pads=[...document.querySelectorAll('.pad')];
const FREQ=[329.6,261.6,220,164.8]; // the classic toy's four notes
const SPEED={slow:[700,300],mid:[480,200],fast:[300,120]};
let seq=[],pos=0,state='idle',speed='mid',kind='classic',bestShown=0;
try{speed=localStorage.getItem('simon-speed')||speed;kind=localStorage.getItem('simon-kind')||kind}catch(e){}
const bestKey=()=>`simon-best-${kind}-${speed}`;
function getBest(){try{return +localStorage.getItem(bestKey())||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(bestKey(),v)}catch(e){}}
function syncSeg(id,val){document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===val))}
function syncAll(){syncSeg('speed',speed);syncSeg('kind',kind);$('best').textContent=getBest();
  $('help').textContent=kind==='reverse'?'מצב הפוך: המשחק מדליק צבעים, ואתם לוחצים עליהם מהסוף להתחלה! במחשב אפשר גם עם המקשים 1 עד 4.':'המשחק מדליק צבעים לפי הסדר, וצריך ללחוץ עליהם באותו סדר. בכל שלב מתווסף עוד צבע אחד. במחשב אפשר גם עם המקשים 1 עד 4.'}
syncAll();
['speed','kind'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b||state==='show')return;
  if(id==='speed')speed=b.dataset.v;else kind=b.dataset.v;
  try{localStorage.setItem('simon-'+id,b.dataset.v)}catch(e){};syncAll();if(state!=='idle')gameOver(true)}));

/* ---------- sound ---------- */
let ac=null;
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}return ac}
function note(f,ms,type='triangle',v=.18){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.setValueAtTime(v,s+ms/1000-.04);g.gain.exponentialRampToValueAtTime(.001,s+ms/1000);
  o.connect(g).connect(a.destination);o.start(s);o.stop(s+ms/1000+.05)}

/* ---------- game ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function light(i,ms){pads[i].classList.add('lit');note(FREQ[i],ms);setTimeout(()=>pads[i].classList.remove('lit'),ms)}
function hub(html){$('hub').innerHTML=html}
function showLevel(){hub(`<div><b>${seq.length}</b><small>שלב</small></div>`);$('lvl').textContent=seq.length}
async function playSeq(){
  state='show';$('msg').textContent='👀 תסתכלו...';showLevel();
  const [on,gap]=SPEED[speed],f=Math.max(.55,1-seq.length*.025); // gets a little faster as it grows
  await wait(600);
  for(const i of seq){if(state!=='show')return;light(i,on*f);await wait((on+gap)*f)}
  state='input';pos=0;$('msg').textContent=kind==='reverse'?'🔄 עכשיו אתם, מהסוף להתחלה!':'👉 עכשיו אתם!';
}
function nextRound(){seq.push(Math.floor(Math.random()*4));playSeq()}
function startGame(){audio();seq=[];bestShown=getBest();document.activeElement&&document.activeElement.blur();nextRound()}
function press(i){
  if(state!=='input'){return}
  const want=kind==='reverse'?seq[seq.length-1-pos]:seq[pos];
  if(i!==want){light(i,250);gameOver(false);return}
  light(i,220);pos++;
  if(pos===seq.length){
    state='wait';
    const n=seq.length;
    if(n>getBest()){setBest(n);$('best').textContent=n}
    const cheers=['יפה!','מעולה!','כל הכבוד!','איזה זיכרון!','אלוף!'];
    $('msg').textContent=n%5===0?`🔥 ${n} צבעים! מדהים!`:'✓ '+cheers[Math.floor(Math.random()*cheers.length)];
    if(n%5===0)confetti(90);
    setTimeout(nextRound,800);
  }
}
function gameOver(silent){
  state='idle';const n=Math.max(0,seq.length-1);
  if(!silent){
    $('toy').classList.remove('wrong');void $('toy').offsetWidth;$('toy').classList.add('wrong');
    note(110,600,'sawtooth',.12);
    const record=n>bestShown&&n>0;
    $('msg').textContent=record?`🏆 שיא חדש! זכרתם ${n} צבעים ברצף`:n>0?`אופס! זכרתם ${n} צבעים ברצף. עוד פעם?`:'אופס! עוד פעם?';
    if(record){confetti(200);[523,659,784,1046].forEach((f,k)=>setTimeout(()=>note(f,300),k*120))}
    // show the right answer
    const want=kind==='reverse'?seq[seq.length-1-pos]:seq[pos];
    setTimeout(()=>{pads[want].classList.add('lit');setTimeout(()=>pads[want].classList.remove('lit'),700)},450);
  }else $('msg').textContent='לחצו "התחל" ותסתכלו טוב על הצבעים';
  setTimeout(()=>{hub('<button class="start" id="start" type="button">'+(silent?'התחל':'עוד פעם')+'</button>');$('start').onclick=startGame;$('start').focus({preventScroll:true})},silent?0:1100);
  $('lvl').textContent=n;
}
pads.forEach((p,i)=>p.addEventListener('pointerdown',e=>{e.preventDefault();press(i)}));
pads.forEach((p,i)=>p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();press(i)}}));
$('start').onclick=startGame;
addEventListener('keydown',e=>{
  const m={Digit1:0,Digit2:1,Digit3:2,Digit4:3,Numpad1:0,Numpad2:1,Numpad3:2,Numpad4:3}[e.code];
  if(m!==undefined){e.preventDefault();press(m)}
  if((e.code==='Space'||e.code==='Enter')&&state==='idle'&&document.activeElement===document.body){e.preventDefault();startGame()}
});

/* ---------- confetti ---------- */
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cc=$('confetti'),cx=cc.getContext('2d'),COLS=['#1fbf6b','#ff4a3d','#ffcc33','#2b8cff','#FFF8EC'];
function confetti(n){if(still)return;cc.width=innerWidth;cc.height=innerHeight;
  const ps=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:Math.random()*6+4,c:COLS[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function t(){cx.clearRect(0,0,cc.width,cc.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
    if(++f<140)requestAnimationFrame(t);else cx.clearRect(0,0,cc.width,cc.height)})()}
})();
</script>
</body>
</html>
